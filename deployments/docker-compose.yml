name: feedvideo

# =============================================================================
# FeedVideo 生产编排（P0.1/P0.2）
# - 所有敏感凭据必须通过 .env / Docker Secret 注入，缺失即 fail-fast
# - Gateway 不暴露任何宿主端口，仅允许 nginx（80/443，TLS 终止）访问
# - 基础镜像全部固定精确版本；CI 有 digest 门禁防漂移
# - 本地开发请叠加 docker-compose.dev.yml（暴露 8080 与可视化工具）
# =============================================================================

networks:
  feedvideo:
    driver: bridge

services:
  mysql:
    image: mysql:8.0.41
    container_name: feedvideo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Missing required secret MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-feedvideo}
    expose:
      - "3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - feedvideo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:7.0.14
    container_name: feedvideo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Missing required secret MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Missing required secret MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MYSQL_DATABASE:-feedvideo}
    expose:
      - "27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - feedvideo
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.2-alpine
    container_name: feedvideo-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
    networks:
      - feedvideo
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: feedvideo-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      http.cors.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    expose:
      - "9200"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - feedvideo
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  rabbitmq:
    image: rabbitmq:4.0.5-management
    container_name: feedvideo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Missing required secret RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Missing required secret RABBITMQ_DEFAULT_PASS}
    expose:
      - "5672"
      - "15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks:
      - feedvideo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: feedvideo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Missing required secret MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Missing required secret MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - feedvideo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: feedvideo-gateway
    restart: unless-stopped
    # 生产不暴露宿主端口：公网只能经 nginx（80/443）访问（P0.1）
    expose:
      - "8080"
    environment:
      - TMPDIR=/tmp/uploads
      - STATS_SYNC_INTERVAL_SECONDS=300
      - LIKE_STATE_MODE=${LIKE_STATE_MODE:-legacy}
      # C2 template only: keep legacy until isolated mapping/backfill/visibility acceptance.
      - SEARCH_PROJECTION_MODE=${SEARCH_PROJECTION_MODE:-legacy}
      - SEARCH_PROJECTION_INDEX=${SEARCH_PROJECTION_INDEX:-videos_projection_v1}
      - APP_ENV=${APP_ENV:-production}
      - MIGRATIONS_MODE=${MIGRATIONS_MODE:-check}
      - DB_AUTO_MIGRATE=${DB_AUTO_MIGRATE:-false}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MONGO_URI=${MONGO_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MYSQL_DATABASE:-feedvideo}?authSource=admin}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Missing required secret JWT_SECRET_KEY}
      - ADMIN_IDS=${ADMIN_IDS:-26}
      - PRIVATE_KEY_PATH=/app/keys/private.pem
      - PUBLIC_KEY_PATH=/app/keys/public.pem
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./config/config.yml:/app/config/config.yml:ro
      - ../migrations:/app/migrations:ro
      - upload_tmp:/tmp/uploads
      - rsa_keys:/app/keys
    networks:
      - feedvideo
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/livez"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  media-worker:
    build:
      context: .
      dockerfile: media-worker.Dockerfile
    container_name: feedvideo-media-worker
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MEDIA_METRICS_ADDR=:9091
      - MONGO_URI=${MONGO_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MYSQL_DATABASE:-feedvideo}?authSource=admin}
      - MONGO_DB=${MYSQL_DATABASE:-feedvideo}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - VIDEO_BUCKET=${VIDEO_BUCKET:-feedvideo-videos}
      - COVER_BUCKET=${COVER_BUCKET:-feedvideo-covers}
      - FFMPEG_BIN=ffmpeg
    expose:
      - "9091"
    networks:
      - feedvideo
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: notification-worker.Dockerfile
    container_name: feedvideo-notification-worker
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - NOTIF_METRICS_ADDR=:9092
      - MONGO_URI=${MONGO_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MYSQL_DATABASE:-feedvideo}?authSource=admin}
      - MONGO_DB=${MYSQL_DATABASE:-feedvideo}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
    expose:
      - "9092"
    networks:
      - feedvideo
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: feedvideo-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - nginx_certs:/etc/nginx/certs
    networks:
      - feedvideo
    depends_on:
      - gateway

volumes:
  minio_data:
  upload_tmp:
  rsa_keys:
  nginx_certs:
