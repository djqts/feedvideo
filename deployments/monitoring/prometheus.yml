# FeedVideo Prometheus 抓取配置（P1.2/P1.3）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/feedvideo.rules.yml

scrape_configs:
  - job_name: feedvideo-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: feedvideo-notification-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-worker:9092"]

  - job_name: feedvideo-media-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["media-worker:9091"]

  # /readyz 可用性探测（配合 FeedVideoNotReady 告警）
  - job_name: feedvideo-readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nginx/readyz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
