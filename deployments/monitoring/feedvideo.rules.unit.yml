              severity: "critical"
            exp_annotations:
              summary: "必需指标缺失：feedvideo_media_tasks_queue_depth（feedvideo-media-worker bad）"
          -
            exp_labels:
              job: "feedvideo-media-worker"
              instance: "bad"
