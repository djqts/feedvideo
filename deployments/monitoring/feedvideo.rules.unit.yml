        alertname: "FeedVideoRequiredMetricMissing"
        exp_alerts:
          -
            exp_labels:
              job: "feedvideo-gateway"
              instance: "bad"
              metric: "feedvideo_http_requests_total"
              severity: "critical"
            exp_annotations:
              summary: "必需指标缺失：feedvideo_http_requests_total（feedvideo-gateway bad）"
          -
            exp_labels:
              job: "feedvideo-gateway"
              instance: "bad"
              metric: "feedvideo_http_errors_total"
              severity: "critical"
