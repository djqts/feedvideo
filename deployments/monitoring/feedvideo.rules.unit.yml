            exp_annotations:
              summary: "监控 job 缺失：feedvideo-readyz"
      -
        eval_time: "4m"
        alertname: "FeedVideoMetricsJobMissing"
        exp_alerts: []
  -
    name: "E4_eight_required_metrics_missing_and_recover"
