        values: "0+0x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"healthy\",route=\"/videos/:id\",le=\"0.1\"}"
        values: "0+10000x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"bad\",route=\"/videos/:id\",le=\"0.25\"}"
