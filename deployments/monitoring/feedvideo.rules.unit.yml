        values: "0+0x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"healthy\",route=\"/videos/:id\",le=\"5\"}"
        values: "0+10000x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"bad\",route=\"/videos/:id\",le=\"10\"}"
        values: "0+0x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"healthy\",route=\"/videos/:id\",le=\"10\"}"
        values: "0+10000x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"bad\",route=\"/videos/:id\",le=\"+Inf\"}"
        values: "0+1x12"
