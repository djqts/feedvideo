          -
            exp_labels:
              job: "feedvideo-readyz"
              instance: "bad"
              severity: "critical"
            exp_annotations:
              summary: "指标抓取持续失败（feedvideo-readyz bad）"
      -
        eval_time: "4m"
        alertname: "FeedVideoMetricsTargetDown"
        exp_alerts: []
      -
        eval_time: "2m"
        alertname: "FeedVideoRequiredMetricMissing"
        exp_alerts: []
  -
    name: "E4_all_jobs_absent_and_recover"
    interval: "1m"
    input_series:
      -
        series: "up{job=\"feedvideo-gateway\",instance=\"bad\"}"
        values: "_ _ _ _ 1+0x5"
      -
        series: "up{job=\"feedvideo-notification-worker\",instance=\"bad\"}"
        values: "_ _ _ _ 1+0x5"
      -
        series: "up{job=\"feedvideo-media-worker\",instance=\"bad\"}"
        values: "_ _ _ _ 1+0x5"
      -
        series: "up{job=\"feedvideo-readyz\",instance=\"bad\"}"
        values: "_ _ _ _ 1+0x5"
    alert_rule_test:
      -
        eval_time: "0m"
        alertname: "FeedVideoMetricsJobMissing"
        exp_alerts: []
      -
        eval_time: "1m"
        alertname: "FeedVideoMetricsJobMissing"
        exp_alerts:
          -
            exp_labels:
              job: "feedvideo-gateway"
              severity: "critical"
            exp_annotations:
              summary: "监控 job 缺失：feedvideo-gateway"
          -
            exp_labels:
              job: "feedvideo-notification-worker"
              severity: "critical"
            exp_annotations:
              summary: "监控 job 缺失：feedvideo-notification-worker"
          -
            exp_labels:
              job: "feedvideo-media-worker"
              severity: "critical"
            exp_annotations:
              summary: "监控 job 缺失：feedvideo-media-worker"
          -
            exp_labels:
              job: "feedvideo-readyz"
