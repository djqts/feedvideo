      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"bad\",route=\"/videos/:id\",le=\"1\"}"
        values: "0+100x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"other-service\",instance=\"bad\",route=\"/videos/:id\",le=\"1\"}"
        values: "0+0x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"bad\",route=\"/videos/:id\",le=\"2.5\"}"
        values: "0+100x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"other-service\",instance=\"bad\",route=\"/videos/:id\",le=\"2.5\"}"
        values: "0+0x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"bad\",route=\"/videos/:id\",le=\"5\"}"
        values: "0+100x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"other-service\",instance=\"bad\",route=\"/videos/:id\",le=\"5\"}"
        values: "0+0x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"bad\",route=\"/videos/:id\",le=\"10\"}"
        values: "0+100x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"other-service\",instance=\"bad\",route=\"/videos/:id\",le=\"10\"}"
        values: "0+0x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"bad\",route=\"/videos/:id\",le=\"+Inf\"}"
        values: "0+100x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"other-service\",instance=\"bad\",route=\"/videos/:id\",le=\"+Inf\"}"
        values: "0+100x12"
    alert_rule_test:
      -
        eval_time: "7m"
        alertname: "FeedVideoHighP95Latency"
        exp_alerts: []
  -
    name: "E4_healthy_instance_cannot_dilute_slow_instance"
    interval: "1m"
    input_series:
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"bad\",route=\"/videos/:id\",le=\"0.005\"}"
        values: "0+0x12"
      -
        series: "feedvideo_http_request_duration_seconds_bucket{job=\"feedvideo-gateway\",instance=\"healthy\",route=\"/videos/:id\",le=\"0.005\"}"
        values: "0+0x12"
      -
