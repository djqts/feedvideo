  -
    name: "E4_all_targets_down_and_recover"
    interval: "1m"
    input_series:
      -
        series: "up{job=\"feedvideo-gateway\",instance=\"bad\"}"
        values: "0+0x3 1+0x3"
      -
        series: "up{job=\"feedvideo-notification-worker\",instance=\"bad\"}"
        values: "0+0x3 1+0x3"
      -
        series: "up{job=\"feedvideo-media-worker\",instance=\"bad\"}"
        values: "0+0x3 1+0x3"
      -
        series: "up{job=\"feedvideo-readyz\",instance=\"bad\"}"
        values: "0+0x3 1+0x3"
    alert_rule_test:
      -
        eval_time: "0m"
        alertname: "FeedVideoMetricsTargetDown"
        exp_alerts: []
      -
        eval_time: "1m"
        alertname: "FeedVideoMetricsTargetDown"
        exp_alerts:
          -
            exp_labels:
              job: "feedvideo-gateway"
              instance: "bad"
              severity: "critical"
            exp_annotations:
              summary: "指标抓取持续失败（feedvideo-gateway bad）"
          -
            exp_labels:
              job: "feedvideo-notification-worker"
              instance: "bad"
              severity: "critical"
            exp_annotations:
              summary: "指标抓取持续失败（feedvideo-notification-worker bad）"
          -
            exp_labels:
              job: "feedvideo-media-worker"
              instance: "bad"
              severity: "critical"
            exp_annotations:
