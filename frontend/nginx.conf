# =============================================================================
# FeedVideo nginx — 生产 HTTPS 入口（P0.1）
# - TLS 1.2/1.3，HSTS，安全响应头
# - 证书来自 /etc/nginx/certs（entrypoint 首次自动生成自签证书；生产替换为
#   Let's Encrypt/云证书，并配置自动续期与过期告警，见 deployments/README.md）
# - 所有转发到 gateway 的请求设置 X-Forwarded-Proto，保证 Cookie Secure 生效
# =============================================================================

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：浏览器只允许 HTTPS 访问（生产域名需加入 preload 后启用 includeSubDomains）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Auth endpoints — gateway registers these at the root (no /api prefix).
    # Front-end may call /api/auth/* or /api/v1/auth/* to keep the V1 namespace
    # schema consistent across all API calls. Both variants are supported.
    # The ^~ prefix ensures these exact-match locations take precedence over
    # the catch-all /api/ proxy below.
    location ^~ /api/auth/login {
        proxy_pass http://gateway:8080/login$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/auth/register {
        proxy_pass http://gateway:8080/register$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/auth/refresh {
        proxy_pass http://gateway:8080/refresh-token$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/v1/auth/login {
        proxy_pass http://gateway:8080/login$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/v1/auth/register {
        proxy_pass http://gateway:8080/register$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/v1/auth/refresh {
        proxy_pass http://gateway:8080/refresh-token$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Exact compatibility aliases for authenticated user root routes.
    location ~ ^/api/(logout|profile|follow|unfollow|black|unblack|followers|following|friends|blacklist|common-following|is-following|search/users)$ {
        proxy_pass http://gateway:8080/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Business API — forwarded unchanged; gateway serves /api/v1/* (NO rewrite).
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 健康检查同样走 HTTPS 代理（供 LB/编排器检查 /livez /readyz /health）。
    # /metrics 不对外暴露：Prometheus 在内部网络直接抓取 gateway:8080。
    location = /livez { proxy_pass http://gateway:8080/livez; proxy_set_header X-Forwarded-Proto https; }
    location = /readyz { proxy_pass http://gateway:8080/readyz; proxy_set_header X-Forwarded-Proto https; }
    location = /health { proxy_pass http://gateway:8080/health; proxy_set_header X-Forwarded-Proto https; }
    location = /metrics { return 404; }

    # Static files — MinIO proxy (trailing / strips /storage prefix so
    # /storage/feedvideo-videos/x.mp4 → proxy_pass /feedvideo-videos/x.mp4)
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_buffering on;
        proxy_cache_valid 200 1d;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback — all client-side routes (/, /login, /topics/:name, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
